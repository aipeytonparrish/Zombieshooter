; Input actions and mapping contexts are built in C++ (UZSInputSet), so no .uasset is needed.
; Dead zones, response curves and sensitivity are applied in C++ from UZSGameUserSettings so the
; settings menu can change them live. The engine-level axis processing is therefore neutralised here.
